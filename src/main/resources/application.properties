spring.application.name=fakenews-server

# DataSource (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fakenews_db?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Spring JPA
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 운영 환경에서는 반드시 32바이트 이상의 무작위 값으로 설정하세요.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
